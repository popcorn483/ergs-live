name: Cup probe (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out; A="Mozilla/5.0 (ERGS Live cup tables)"
          curl -sS -A "$A" -m 60 -X POST 'https://ulsterrugby.sportlomo.com/wp-admin/admin-ajax.php?action=comp' -d 'seasonid=4083&userid=6941' -o comp.json || true
          for u in league/216035/ competition_fixtures_results/216037/ league_fixtures_results/216035/ fixtures_results/216035/ league_table/216035/; do f=$(echo "$u" | sed 's#[^a-z0-9]#_#g'); curl -sSL -A "$A" -m 60 "https://ulsterrugby.sportlomo.com/$u" -o "$f.html" -w "$u %{http_code} %{size_download}\n" || true; done
          curl -sS -A "$A" -m 60 -X POST 'https://ulsterrugby.sportlomo.com/wp-admin/admin-ajax.php?action=competitions' -d 'resetgroup=&group=4310&groups=4310&action=competitions&userid=6941&season=4083' -o competitions.json || true
          git init -q; git checkout -q -b probe; git add -A; git -c user.name=probe -c user.email=probe@x commit -q -m probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
