<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
/* ERGS Live: the supporters' scoreboard. One deliberate dark, floodlit look in the school's navy, gold and red. */
:root{
  --night:#0F1530; --deck:#141B38; --panel:#19213F; --raise:#222C52; --rule:#2D3962;
  --chalk:#F1F0EC; --mute:#9CA4C0; --dim:#6B7596;
  --gold:#DCC08A; --gold-ink:#1A1630; --red:#E3262A; --win:#6FD6A6; --loss:#FF9D94;
  --f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--chalk);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(900px 420px at 85% -10%,#1b2a52 0%,transparent 65%)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
header{display:flex;align-items:center;gap:12px;padding-block:6px 14px}
header img{width:46px;height:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
header h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(26px,6vw,36px);text-transform:uppercase;letter-spacing:.01em;line-height:1}
header h1 span{color:var(--gold)}
header .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-cond);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--raise);color:var(--mute);white-space:nowrap}
.pill.live{background:rgba(227,38,42,.18);color:#ff8f8a}
.pill.live::before,.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,87,77,.6)}70%{box-shadow:0 0 0 8px rgba(229,87,77,0)}100%{box-shadow:0 0 0 0 rgba(229,87,77,0)}}
.demo{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;border-radius:10px;border:1px dashed rgba(220,192,138,.5);background:rgba(220,192,138,.07);color:#e9dcbf;font-size:14px;margin-bottom:16px}
.demo b{color:var(--gold)}
.demo button{margin-left:auto;border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:8px;padding:6px 12px;font-family:var(--f-cond);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px}
.tabs{display:flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--deck);margin-bottom:16px}
.tabs button{flex:1;height:42px;border:0;background:transparent;font-family:var(--f-cond);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.tabs button[aria-pressed="true"]{background:var(--raise);color:var(--chalk);box-shadow:inset 0 -2px 0 var(--gold)}
.sec{font-family:var(--f-cond);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--mute);margin:22px 0 10px;display:flex;align-items:center;gap:12px}
.sec::after{content:"";flex:1;height:1px;background:var(--rule)}
.empty{padding:22px;border:1px dashed var(--rule);border-radius:12px;color:var(--mute);text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
/* crests */
.crest{width:28px;height:28px;flex:none;display:inline-grid;place-items:center;border-radius:50%;overflow:hidden}
.crest img{width:100%;height:100%;object-fit:contain}
.crest.ini{background:var(--c,#3A4466);font-family:var(--f-cond);font-weight:700;font-size:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.crest.big{width:clamp(52px,12vw,84px);height:clamp(52px,12vw,84px)}.crest.big.ini{font-size:clamp(17px,4vw,26px)}
.crest.huge{width:120px;height:120px;border-radius:0}.crest.huge.ini{border-radius:50%;font-size:42px}
/* live scoreboard cards */
.board{display:grid;gap:12px}
.sb{position:relative;overflow:hidden;border-radius:16px;border:1px solid rgba(227,38,42,.55);background:radial-gradient(700px 240px at 50% 0%,#1b2a52 0%,var(--panel) 70%);padding:clamp(14px,3vw,24px);display:grid;gap:12px;text-align:center;width:100%}
.sb::before,.sb::after{content:"";position:absolute;top:0;bottom:0;width:38%;opacity:.22;pointer-events:none}
.sb::before{left:0;background:linear-gradient(90deg,var(--hc,#333),transparent)}.sb::after{right:0;background:linear-gradient(270deg,var(--ac,#333),transparent)}
.sb > *{position:relative;z-index:1}
.sb-meta{font-family:var(--f-cond);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.sb-main{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:clamp(6px,3vw,28px)}
.side{display:grid;gap:6px;justify-items:center;min-width:0}
.side b{font-family:var(--f-display);font-weight:800;font-size:clamp(15px,3.8vw,30px);text-transform:uppercase;line-height:1;overflow-wrap:anywhere;max-width:100%}
.score{display:flex;align-items:center;gap:clamp(6px,2vw,16px);font-family:var(--f-display);font-weight:900;font-size:clamp(46px,12.5vw,104px);line-height:.9;font-variant-numeric:tabular-nums}
.score .dash{color:var(--dim);font-size:.5em}.score .lead{color:var(--gold)}
.score .bump{animation:bump .9s cubic-bezier(.2,.9,.3,1.4)}
@keyframes bump{0%{transform:translateY(-40%) scale(1.5);color:#fff;text-shadow:0 0 30px var(--gold)}100%{transform:none}}
.clock{justify-self:center;display:inline-flex;align-items:center;gap:10px;font-family:var(--f-mono);font-weight:600;font-size:clamp(17px,4vw,22px);font-variant-numeric:tabular-nums;padding:5px 14px;border-radius:999px;background:rgba(0,0,0,.3);border:1px solid rgba(227,38,42,.6)}
.clock .dot{display:inline-flex}
.bins{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.bin{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 6px;border-radius:6px;background:rgba(0,0,0,.3);max-width:100%;flex-wrap:wrap;justify-content:center}
.bin i{width:9px;height:12px;border-radius:2px}.bin.yc i{background:#F3C443}.bin.rc i{background:#E5483B}
.bin b{font-family:var(--f-mono);color:#F3C443;font-variant-numeric:tabular-nums}
.last3{display:grid;gap:4px;text-align:left;border-top:1px solid rgba(255,255,255,.1);padding-top:10px;font-size:14px}
.last3 div{display:grid;grid-template-columns:38px minmax(0,1fr);gap:8px;color:#d5dbe8}
.last3 span:first-child{font-family:var(--f-mono);color:var(--mute);text-align:right}
.tap{font-size:12px;color:var(--dim)}
/* fixture / result rows */
.list{display:grid;gap:6px}
.row{display:grid;grid-template-columns:50px 30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--panel);text-align:left;width:100%}
.row .crest{width:30px;height:30px}
.cd{display:grid;justify-items:center;line-height:1}.cd b{font-family:var(--f-display);font-weight:900;font-size:26px}.cd span{font-family:var(--f-cond);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.ri{display:grid;min-width:0}.ri b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ri span{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* score animation */
.fx{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:hidden;--tc:#1C2342}
.fx[hidden]{display:none}

@keyframes fxbg{from{background:rgba(4,8,18,0)}to{background:rgba(4,8,18,.8)}}

.fx-band{position:absolute;left:-20%;right:-20%;top:50%;height:min(46vh,340px);transform:translateY(-50%) skewY(-8deg) scaleX(0);transform-origin:left center;background:linear-gradient(90deg,var(--tc),color-mix(in srgb,var(--tc) 70%,#fff 30%) 50%,var(--tc));box-shadow:0 0 0 6px var(--gold),0 30px 80px rgba(0,0,0,.6)}

@keyframes letter{to{opacity:1;transform:none;filter:none}}
.fx.k-yc .fx-kind,.fx.k-rc .fx-kind{font-size:clamp(40px,10vw,110px)}.fx.k-yc .fx-kind,.fx.k-yc .fx-who{color:#1a1500;text-shadow:none}
.fx-who,.fx-score{opacity:0;transform:translateY(10px)}

@keyframes up{to{opacity:1;transform:none}}
.fx-who{font-family:var(--f-cond);font-weight:700;font-size:clamp(18px,4vw,28px);letter-spacing:.06em;text-transform:uppercase}
.fx-score{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,4.5vw,34px);text-transform:uppercase;color:var(--gold);background:rgba(8,12,28,.85);padding:6px 16px;border-radius:8px;margin-top:8px}
.fx-score:empty{display:none}
.fx-burst{position:absolute;left:50%;top:50%}

.fx-burst i:nth-child(3n){background:#fff;border-radius:50%}.fx-burst i:nth-child(3n+1){background:var(--red)}
.fx.on .fx-burst i{animation:burst 1.4s calc(.35s + var(--d)) cubic-bezier(.1,.8,.3,1) forwards}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(var(--s)) rotate(0)}100%{opacity:0;transform:translate(var(--x),calc(var(--y) + 120px)) scale(var(--s)) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important}}
/* coach tools */

/* referee's card */
.fx-cardwrap{position:relative;width:150px;height:190px;display:grid;place-items:center;perspective:700px}

.fx-card.rc{background:linear-gradient(160deg,#FF6B5C,#E5483B 55%,#B4241A)}
.fx-card span{position:absolute;inset:-40% auto -40% -60%;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg)}
