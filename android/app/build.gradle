plugins {
    id 'com.android.application'
}

// ERGS Live for Android: opens https://popcorn483.github.io/ergs-live/ full screen using Chrome
// (a Trusted Web Activity), so the live scoreboard, animations and Google sign-in work as on the web.
def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'uk.org.ergs.live'
    compileSdk 36

    defaultConfig {
        applicationId 'uk.org.ergs.live'
        minSdk 21
        targetSdk 36
        versionCode run
        versionName "1.0.${run}"
    }

    signingConfigs {
        ergs {
            // A private signing key, when the build is given one (GitHub secrets ANDROID_KEYSTORE_B64 and ANDROID_KEY_PASS);
            // otherwise the original key kept in this folder, whose password is public.
            def ks = System.getenv('ERGS_KEYSTORE'), kp = System.getenv('ERGS_KEY_PASS')
            def own = ks && kp && new File(ks).exists()
            storeFile own ? new File(ks) : file('../ergs-live.keystore')
            storePassword own ? kp : 'ergslive'
            keyAlias 'ergslive'
            keyPassword own ? kp : 'ergslive'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.ergs
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
}
